name: Build Flovex Launcher

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flovex-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid re-installing the obsolete "tools" package via sdkmanager.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compile desktop app
        run: gradle :composeApp:compileKotlinDesktop

      - name: Build Android debug APK
        run: gradle :composeApp:assembleDebug

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flovex-launcher-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk
