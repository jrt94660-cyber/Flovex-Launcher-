name: Build Flovex Android (Zalith engine)

on:
  push:
    branches: [zalith-android-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flovex overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Zalith Launcher 2 source
        run: |
          git clone --filter=blob:none https://github.com/ZalithLauncher/ZalithLauncher2.git upstream
          cd upstream
          git checkout 4607f153fcce149a8e0ad39dc93fc447589d9f17

      - name: Apply Flovex branding
        run: |
          cp porting/zalith-gradle.properties upstream/ZalithLauncher/gradle.properties
          cp porting/FLovex-PORTING-NOTICE.md upstream/FLOVEX-PORTING-NOTICE.md

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" | tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Set up Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flovex-android-arm64-debug
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
