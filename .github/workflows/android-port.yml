name: Build Flovex Android

on:
  push:
    branches: [zalith-android-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flovex overlay
        uses: actions/checkout@v4

      - name: Checkout Zalith Launcher 2.8.2 engine
        run: |
          git clone --filter=blob:none https://github.com/ZalithLauncher/ZalithLauncher2.git upstream
          cd upstream
          git checkout dbf5a414504cdeb584d9e8fb437078b77b512ba4

      - name: Apply Flovex features and branding
        run: |
          cp porting/zalith-gradle.properties upstream/ZalithLauncher/gradle.properties
          cp porting/FLovex-PORTING-NOTICE.md upstream/FLOVEX-PORTING-NOTICE.md
          python3 porting/apply-flovex.py upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: 'latest'

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Install Android NDK
        run: |
          sdkmanager --install "platforms;android-37.2" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          sdkmanager --list | grep -E 'platforms;android-(36|37)' || true

      - name: Create CI debug signing key
        run: |
          rm -f upstream/ZalithLauncher/zalith_launcher_debug.jks
          keytool -genkeypair -noprompt -keystore upstream/ZalithLauncher/zalith_launcher_debug.jks \
            -storepass flovex-debug-only -keypass flovex-debug-only \
            -alias movtery_zalith_debug -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Flovex Launcher, OU=Development, O=Flovex, C=PH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build arm64 debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flovex-Launcher-Android-arm64
          path: upstream/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
